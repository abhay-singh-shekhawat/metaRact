name: CI

on:
  push:
    branches: [main, "feat/**", "chore/**"]
  pull_request:

# A newer push obsoletes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · unit · integration · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node, which reads the pnpm store path for its cache.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # Hermetic: the suite runs the dev server against the local file store,
      # the in-process rate limiter and the Turnstile dev bypass, so it needs no
      # secrets and no external accounts. See tests/e2e/env.ts.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            test-results
            playwright-report
          retention-days: 7

  # `pnpm check:production-config` is deliberately absent: it is designed to
  # fail while public business facts are still placeholders (studio name,
  # contact email), and it belongs in the pre-deploy gate, not on every push.
